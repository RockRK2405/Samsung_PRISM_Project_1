<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Analysis | OmniDetect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav>
        <div class="container nav-content">
            <div class="nav-brand">
                <a href="/">
                    <img src="/assets/prism_logo.png" alt="Samsung PRISM Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIGZpbGw9IiMxNDI4QTAiLz48dGV4dCB4PSIxNiIgeT0iMjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlA8L3RleHQ+PC9zdmc+';" />
                    <span>OmniDetect</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/analyzer">Analyzer</a>
                <a href="/batch" class="active">Batch</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/about">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2 class="mb-4">Batch Analysis</h2>
        
        <div class="card mb-4">
            <div class="upload-zone" id="upload-zone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Drag & Drop files here</h3>
                <p class="text-muted mb-3">or click to browse</p>
                <button class="btn btn-primary" id="btn-browse">Select File</button>
                <input type="file" id="file-input" class="hidden" accept=".txt,.csv,.jsonl">
            </div>
            <div class="mt-2 text-center text-sm text-muted">
                Supported formats: .txt (one text per line), .csv (must have a 'text' column), .jsonl (must have a 'text' field)
            </div>
        </div>

        <div id="results-section" class="hidden">
            <div class="stats-grid mb-4" id="batch-stats">
                <!-- Populated by JS -->
            </div>
            
            <div class="card" style="overflow-x: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center;" class="mb-3">
                    <h3>Results</h3>
                    <button class="btn btn-secondary btn-sm" id="btn-export">Export CSV</button>
                </div>
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Text Preview</th>
                            <th>Verdict</th>
                            <th>Confidence</th>
                            <th>Auth. Score</th>
                            <th>AI Prob.</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script src="/js/app.js"></script>
    <script src="/js/batch.js"></script>
</body>
</html>
