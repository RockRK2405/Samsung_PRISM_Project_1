[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-synthetic-detection"
version = "2.0.0"
description = "Multi-signal AI text detection with explainability for the PRISM project."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "textstat>=0.7",
]

[project.optional-dependencies]
perplexity = [
    # torch stays >=2.2,<2.3 to match the Video module's facenet-pytorch
    # pin (facenet-pytorch==2.6.0 requires torch<2.3) -- they share one venv
    # in the fusion engine, so torch can't be bumped just for this module.
    # An unbounded `transformers>=4.30` will happily resolve to a release
    # that requires torch>=2.4 at runtime (silently disables its PyTorch
    # backend below that instead of failing install) -- cap it below that
    # line instead of bumping torch. If perplexity scoring needs a newer
    # transformers feature later, that's the number to renegotiate, not
    # this torch ceiling.
    "torch>=2.2,<2.3",
    "transformers>=4.30,<4.45",
]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
]
all = [
    "prism-synthetic-detection[perplexity,web]",
]

[tool.setuptools.packages.find]
where = ["src"]
