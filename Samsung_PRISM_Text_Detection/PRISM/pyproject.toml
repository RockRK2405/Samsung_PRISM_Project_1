[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-synthetic-detection"
version = "2.0.0"
description = "Multi-signal AI text detection with explainability for the PRISM project."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "textstat>=0.7",
]

[project.optional-dependencies]
perplexity = [
    # transformers>=4.30 itself now requires torch>=2.4 at runtime (it
    # silently disables the PyTorch backend below that, falling back to
    # tokenizer/config-only mode) — pin the true floor here so `pip install`
    # catches the mismatch instead of a confusing runtime warning.
    "torch>=2.4",
    "transformers>=4.30",
]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
]
all = [
    "prism-synthetic-detection[perplexity,web]",
]

[tool.setuptools.packages.find]
where = ["src"]
