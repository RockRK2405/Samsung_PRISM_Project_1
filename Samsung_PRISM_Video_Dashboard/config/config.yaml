# =====================================================================
# Video Synthetic Media Detection — Research Testing Dashboard
# Central configuration. Nothing model-related is hardcoded in the app;
# it all comes from here (requirement 13).
# =====================================================================

# ---------------------------------------------------------------------
# Model integration
# ---------------------------------------------------------------------
model:
  # Path to the existing Video Detection module (the sibling repo folder).
  # model_service.py adds this to sys.path and imports src.inference —
  # the exact pattern the fusion engine already uses. Relative to the
  # dashboard root.
  video_module_path: "../Samsung_PRISM_Video_Detection"

  # ---- Pipeline ---------------------------------------------------------
  # "unified": every video goes through BOTH branches below and the verdict is
  #   synthetic if either fires. Use this.
  # "face_only": legacy single face model (crashes on faceless video).
  pipeline: "unified"

  name: "UnifiedVideoDetector (general AI-video + face-swap)"
  architecture: "General: VideoSpatialNet ConvNeXt-Tiny + attention-pool on full frames. Face: ConvNeXt-Tiny on MTCNN face crops. OR-fused."
  version: "EXP-004 + EXP-006"

  # General AI-video branch -- EXP-004 (unseen-generator ROC-AUC 0.9426).
  # Always runs; the only branch that can judge faceless video.
  general_checkpoint: "checkpoints/best_model.pt"
  general_threshold: 0.5

  # Face-swap branch -- EXP-006 (video-level ROC-AUC 0.9896 on unseen identities).
  # NOTE: best.pt is NOT a face model (overwritten 2026-09-06; see MANIFEST.md).
  checkpoint: "checkpoints/face_celebdf_identity.pt"
  face_threshold: 0.5
  # Face branch runs only if faces are found in at least this share of frames.
  face_coverage_threshold: 0.5

  decision_threshold: 0.5      # used by the legacy face_only pipeline
  device: null                 # null -> auto (mps > cuda > cpu)
  input_size: 224
  frame_sampling_strategy: "uniform"
  frames_sampled: 16           # general model was trained on 16-frame clips
  produce_explanation: true    # GradCAM (face branch only)

  # Legacy ADR-006 router; superseded by pipeline: unified.
  use_multi_target: false

# ---------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------
storage:
  # DB lives under outputs/ so it sits in the mounted volume and history
  # survives container restarts (outputs/ is bind-mounted in docker-compose).
  database: "outputs/experiments.db"
  uploads: "uploads"
  outputs: "outputs"
  frames: "outputs/frames"
  explainability: "outputs/explainability"
  reports: "outputs/reports"

# ---------------------------------------------------------------------
# Upload validation
# ---------------------------------------------------------------------
uploads:
  # Video only. Images are rejected here — the model is per-image internally,
  # but there is no image entry point yet (enablement plan §7.8).
  allowed_extensions: [".mp4", ".mov", ".avi", ".mkv", ".webm"]
  max_size_mb: 500

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
