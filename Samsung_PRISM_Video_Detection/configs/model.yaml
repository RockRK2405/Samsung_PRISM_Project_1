# =====================================================================
# Model configuration — Milestone 6 dual-stream detector
# =====================================================================
# Architecture:
#   RGB backbone  (frozen, warm-started from Milestone 4 checkpoints/best.pt)
#   FFT backbone  (ImageNet init, trained end-to-end)
#   Concat features → LayerNorm + Dropout + Linear(2560, 2)
#   Mean-pool over frames at video level.
#
# See src/models/dual_stream.py and ADR-004.
#
# To roll back to previous milestones:
#   Milestone 5 (transformer): frequency_stream.enabled=false, temporal_head.type=transformer
#   Milestone 4 (baseline):    frequency_stream.enabled=false, temporal_head.type=mean_pool
# =====================================================================

model:
  name: "dual_stream_efficientnet_b0"
  backbone: "tf_efficientnet_b0.ns_jft_in1k"
  pretrained: true

  input:
    image_size: 224
    channels: 3
    frames_per_clip: 32

  spatial_stream:
    enabled: true
    backbone: "tf_efficientnet_b0.ns_jft_in1k"
    freeze: true                        # freeze RGB backbone during training
    warm_start: "checkpoints/best.pt"   # load Milestone-4 baseline's backbone weights

  frequency_stream:
    enabled: true                       # THIS is what selects the dual-stream family
    transform: "log_fft_magnitude"

  temporal_head:
    type: "mean_pool"
    hidden_dim: null
    num_layers: null

  classifier:
    num_classes: 2
    dropout: 0.2
