# =====================================================================
# Model configuration — Milestone 4 baseline
# =====================================================================
# Architecture: per-frame EfficientNet-B0 with a mean-pool video head.
# See src/models/baseline.py and README §4 for the full rationale.
# =====================================================================

model:
  name: "baseline_efficientnet_b0_meanpool"
  backbone: "tf_efficientnet_b0.ns_jft_in1k"    # timm identifier (NoisyStudent pretraining)
  pretrained: true

  input:
    image_size: 224
    channels: 3
    frames_per_clip: 32

  # The Milestone-4 baseline has no dedicated spatial / frequency /
  # temporal blocks — that's the whole point. Milestone 5 adds an
  # LSTM/attention temporal head; Milestone 6 adds the frequency stream.
  spatial_stream:
    enabled: true
    backbone: "tf_efficientnet_b0.ns_jft_in1k"

  frequency_stream:
    enabled: false
    transform: null

  temporal_head:
    type: "mean_pool"
    hidden_dim: null
    num_layers: null

  classifier:
    num_classes: 2
    dropout: 0.2
