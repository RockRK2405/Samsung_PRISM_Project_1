# =====================================================================
# Model configuration — Milestone 5 temporal head
# =====================================================================
# Architecture: per-frame EfficientNet-B0 features → learned CLS token
# + positional embeddings → transformer encoder → linear classifier.
# See src/models/temporal.py and ADR-003 for the full rationale.
#
# To fall back to the Milestone-4 baseline (mean-pool), set
# temporal_head.type: "mean_pool" — the training script auto-dispatches
# on this field, no code changes needed.
# =====================================================================

model:
  name: "temporal_efficientnet_b0"
  backbone: "tf_efficientnet_b0.ns_jft_in1k"
  pretrained: true

  input:
    image_size: 224
    channels: 3
    frames_per_clip: 32

  spatial_stream:
    enabled: true
    backbone: "tf_efficientnet_b0.ns_jft_in1k"

  frequency_stream:
    enabled: false
    transform: null

  temporal_head:
    type: "transformer"       # "mean_pool" (Milestone 4) | "transformer" (Milestone 5)
    hidden_dim: 256
    num_layers: 2
    num_heads: 4

  classifier:
    num_classes: 2
    dropout: 0.2
