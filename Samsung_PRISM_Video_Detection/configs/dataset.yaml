# =====================================================================
# Dataset configuration
# =====================================================================
# Primary training / validation dataset locked in during Milestone 2:
# FaceForensics++ (c23), obtained via the Kaggle mirror at
# https://www.kaggle.com/datasets/xdxd003/ff-c23
#
# Full rationale and license notes: docs/dataset_notes_ff_c23.md
#
# Values marked `null` remain deliberately undecided at this stage and
# will be filled in during Milestones 3–4.
# =====================================================================

dataset:
  name: "faceforensics_pp"
  version: "c23"
  source: "kaggle:xdxd003/ff-c23"        # informational only
  root: "data/raw/ff_c23"                  # resolved against configs/paths.yaml

  splits:
    train: "data/metadata/ff_c23_train.json"   # to be generated in Milestone 3
    val:   "data/metadata/ff_c23_val.json"
    test:  "data/metadata/ff_c23_test.json"
    split_ratio: [0.8, 0.1, 0.1]               # tentative — video-level, no subject leakage
    split_seed: 42

  manipulation_types:
    - Deepfakes
    - Face2Face
    - FaceSwap
    - NeuralTextures
  compression_level: "c23"

  sampling:
    frames_per_video: 32                  # locked in ADR-002
    strategy: "uniform"                   # evenly spaced across the full clip
    face_crop_size: 224                   # matches ViT / EfficientNet / timm defaults

  labels:
    real: 0
    synthetic: 1

  # Held-out cross-dataset evaluation set — decided in Milestone 8, NOT
  # used during training. Candidates: Celeb-DF v2, DFDC sample split.
  cross_dataset_eval:
    name: null
    root: null
