# =====================================================================
# Training configuration — Milestone 6 dual-stream detector
# =====================================================================
# The trainer auto-detects the model family via configs/model.yaml.
# The dual-stream detector trains frame-level (like Milestone 4) so
# we can go back to the larger batch size.
# =====================================================================

train:
  seed: 42
  device: null                    # null = auto-detect (mps on Apple Silicon)

  epochs: 5
  batch_size: 24                  # frame-level. RGB frozen, so memory is closer to
                                  # the M4 baseline than to the temporal model.
  num_workers: 4

  optimizer:
    name: "adamw"
    lr: 0.0003                    # 3e-4 — same as Milestone 4 baseline
    weight_decay: 0.0001

  scheduler:
    name: "cosine"
    warmup_epochs: 0

  loss:
    name: "cross_entropy"
    label_smoothing: 0.05

  augmentation:
    enabled: false

  checkpointing:
    save_every: null
    keep_best_only: true
    metric: "val_f1"

  logging:
    log_every: 50
    tracker: "mlflow"
