# =====================================================================
# Training configuration — Milestone 4 baseline
# =====================================================================

train:
  seed: 42
  device: null                    # null = auto-detect (mps on Apple Silicon)

  epochs: 5                       # baseline — bump to 10 if val F1 still climbing
  batch_size: 32
  num_workers: 4

  optimizer:
    name: "adamw"
    lr: 0.0003                    # 3e-4 — standard for fine-tuning ImageNet CNNs
    weight_decay: 0.0001

  scheduler:
    name: "cosine"                # cosine annealing over `epochs`
    warmup_epochs: 0

  loss:
    name: "cross_entropy"
    label_smoothing: 0.05

  augmentation:
    enabled: false                # Milestone 4 uses raw crops; augmentation added later
    horizontal_flip: null
    color_jitter: null
    random_crop: null

  checkpointing:
    save_every: null
    keep_best_only: true
    metric: "val_f1"

  logging:
    log_every: 50                 # log train loss every 50 steps
    tracker: "mlflow"
