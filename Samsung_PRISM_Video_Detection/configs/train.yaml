# =====================================================================
# Training configuration — Milestone 5 temporal head
# =====================================================================
# The trainer auto-detects whether the model is a mean-pool baseline or
# a temporal detector (via configs/model.yaml's temporal_head.type) and
# switches between frame-level and video-level batching accordingly.
#
# For the temporal detector each sample is 32 face crops, so batch_size
# is much lower than the baseline's 32 to keep memory + wall time sane.
# =====================================================================

train:
  seed: 42
  device: null                    # null = auto-detect (mps on Apple Silicon)

  epochs: 5
  batch_size: 8                   # video-level batches; each sample = 32 crops
  num_workers: 4

  optimizer:
    name: "adamw"
    lr: 0.0001                    # 1e-4 — a touch lower than baseline's 3e-4
    weight_decay: 0.0001

  scheduler:
    name: "cosine"
    warmup_epochs: 0

  loss:
    name: "cross_entropy"
    label_smoothing: 0.05

  augmentation:
    enabled: false
    horizontal_flip: null
    color_jitter: null
    random_crop: null

  checkpointing:
    save_every: null
    keep_best_only: true
    metric: "val_f1"

  logging:
    log_every: 25                 # video-level → fewer steps → log more often
    tracker: "mlflow"
